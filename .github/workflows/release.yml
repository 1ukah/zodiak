name: Build and release desktop packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build zodiak-setup.exe
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Confirm tag matches VERSION and release branch
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "The pushed tag ($env:GITHUB_REF_NAME) must match VERSION (v$version)."
          }
          if ($version -match '^\d+\.\d+\.\d+-beta(?:\.\d+)*$') {
            $releaseBranch = 'beta'
          } elseif ($version -match '^\d+\.\d+\.\d+$') {
            $releaseBranch = 'master'
          } else {
            throw 'Use a stable version (1.2.0) or a beta version (1.2.0-beta).'
          }
          git merge-base --is-ancestor HEAD "origin/$releaseBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Release $version must point to a commit on the $releaseBranch branch."
          }

      - name: Apply version to package metadata
        run: npm run version:sync

      - name: Build and publish updater release
        env:
          GH_TOKEN: ${{ github.token }}
        # The custom publisher derives its version from VERSION after the tag
        # check above; it does not accept electron-builder CLI configuration.
        run: npm run release

  linux:
    name: Build Linux packages
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and capture behavior
        run: npm run typecheck && node tests/linux-capture.cjs
      - name: Build Linux packages
        run: npm run pack:linux
      - name: Build Arch installer package
        run: npx electron-builder --linux pacman --prepackaged dist/linux-unpacked --publish never
      - name: Upload packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*-linux-x86_64.AppImage dist/*-linux-x64.tar.gz dist/*-linux-x64.pacman --clobber

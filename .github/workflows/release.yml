name: Build and release desktop packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Build zodiak-linux-x86_64.AppImage
    # The oldest supported runner keeps the AppImage compatible with older glibc.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PipeWire build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpipewire-0.3-dev pipewire-bin

      - name: Install dependencies
        run: npm ci

      - name: Check types and capture behavior
        run: npm run typecheck && npm run test:capture && npm run test:updater && npm run test:pipewire

      - name: Build AppImage
        run: npm run pack:linux

      - name: Confirm the update manifest
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in *-beta*) manifest=beta-linux.yml ;; *) manifest=latest-linux.yml ;; esac
          grep -q "url: zodiak-linux-x86_64.AppImage" "dist/$manifest"
          grep -q "version: $version" "dist/$manifest"
          mkdir linux-release
          cp dist/zodiak-linux-x86_64.AppImage "dist/$manifest" linux-release/

      - name: Keep the Linux files for the release job
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Build zodiak-setup.exe and publish
    needs: linux
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Confirm tag matches VERSION and release branch
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "The pushed tag ($env:GITHUB_REF_NAME) must match VERSION (v$version)."
          }
          if ($version -match '^\d+\.\d+\.\d+-beta(?:\.\d+)*$') {
            $releaseBranch = 'beta'
          } elseif ($version -match '^\d+\.\d+\.\d+$') {
            $releaseBranch = 'master'
          } else {
            throw 'Use a stable version (1.2.0) or a beta version (1.2.0-beta).'
          }
          git merge-base --is-ancestor HEAD "origin/$releaseBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Release $version must point to a commit on the $releaseBranch branch."
          }

      - name: Download the Linux files
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: linux-release

      - name: Apply version to package metadata
        run: npm run version:sync

      - name: Build and publish updater release
        env:
          GH_TOKEN: ${{ github.token }}
        # The custom publisher derives its version from VERSION after the tag
        # check above; it does not accept electron-builder CLI configuration.
        # The release stays a draft until the Windows and Linux files are uploaded.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-custom-installer.ps1 -Publish -LinuxAssets linux-release

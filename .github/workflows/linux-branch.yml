name: Build Linux branch packages

on:
  push:
    branches:
      - 'feat/linux'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the pushed source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and capture behavior
        run: npm run typecheck && node tests/linux-capture.cjs
      - name: Build AppImage
        run: npm run pack:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: zodiak-linux-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

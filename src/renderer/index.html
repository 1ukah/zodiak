<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welfare Office</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="shell">
      <aside>
        <form id="create-form" class="create-form">
          <input id="new-room" type="text" maxlength="64" placeholder="New room" spellcheck="false" autocomplete="off" />
          <button id="create-room" class="primary" type="submit">Create</button>
        </form>
        <p id="list-note" class="note" role="alert" hidden></p>
        <div id="room-list"></div>
        <footer>
          <label class="field" for="display-name">Display name
            <input id="display-name" type="text" maxlength="40" autocomplete="nickname" />
          </label>
          <details id="server-details">
            <summary>Server</summary>
            <div class="server-fields">
              <label class="field" for="server-url">LiveKit URL
                <input id="server-url" type="text" spellcheck="false" autocomplete="off" />
              </label>
              <label class="field" for="api-key">API key
                <input id="api-key" type="text" spellcheck="false" autocomplete="off" />
              </label>
              <label class="field" for="api-secret">API secret
                <input id="api-secret" type="password" spellcheck="false" autocomplete="off" />
              </label>
            </div>
          </details>
        </footer>
      </aside>
      <section id="stage-wrap">
        <div id="stage-head">
          <div>
            <h1 id="room-title">Select a room</h1>
            <p id="session-meta"></p>
          </div>
          <div class="header-actions">
            <p id="presence" class="offline"><i></i><span id="presence-label">Offline</span></p>
            <button id="hear-audio" class="ghost" type="button" hidden>Enable audio</button>
            <button id="share" class="primary" type="button" hidden>Share screen</button>
            <button id="stop-live" class="danger" type="button" hidden>Stop sharing</button>
            <button id="leave" class="ghost" type="button" hidden>Leave</button>
          </div>
        </div>
        <div id="stage" class="is-idle">
          <video id="stage-video" autoplay playsinline muted></video>
          <div id="waiting">
            <p id="waiting-title">Rooms</p>
            <p id="waiting-copy">Create a room or join one from the list. Everyone sees the same rooms.</p>
          </div>
          <p id="stage-note" class="note" role="alert" hidden></p>
        </div>
      </section>
    </div>
    <div id="picker" hidden>
      <form id="picker-form" class="picker-card">
        <div class="panel-head">
          <h2>Share your screen</h2>
          <button id="refresh-sources" class="ghost" type="button">Refresh</button>
        </div>
        <div id="sources"></div>
        <div class="picker-foot">
          <label class="check" for="system-audio">
            <input id="system-audio" type="checkbox" />
            Share system audio, except Discord
          </label>
          <p id="picker-note" class="note" role="alert" hidden></p>
          <div class="actions">
            <button id="go-live" class="primary" type="submit" disabled>Go live</button>
            <button id="cancel-share" class="ghost" type="button">Cancel</button>
          </div>
        </div>
      </form>
    </div>
    <audio id="remote-audio" autoplay></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zodiak</title><link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="app-titlebar"><img class="app-titlebar-logo" src="/logo.svg" alt="" /></div>
  <div id="shell">
    <nav class="workspace-rail" aria-label="Rooms">
      <div id="room-list" aria-label="Rooms"></div>
      <button id="create-room-action" class="rail-button rail-create" data-create-room title="Create room" aria-label="Create room"><span data-icon="plus"></span></button>
      <div class="rail-footer">
        <button id="lobby-settings" class="rail-button" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button>
        <button id="server-settings" class="rail-button rail-server" title="Server connection" aria-label="Server connection"><span data-icon="server"></span></button>
      </div>
    </nav>
    <aside class="sidebar" id="room-sidebar" hidden>
      <p id="list-note" class="note" role="alert" hidden></p>
      <section id="members-panel" aria-label="Connected people"><div class="members-heading"><span data-icon="people" title="Connected people"></span><span id="members-count"></span><button id="theater" class="icon-button" type="button" title="Focus view" aria-label="Focus view" hidden><span data-icon="focus"></span></button></div><div id="members-list"></div></section>
      <div class="sidebar-spacer"></div>
      <footer class="profile-bar"><span id="profile-avatar" class="avatar">?</span><div class="profile-copy"><strong id="profile-name"></strong></div><button id="voice-mute" class="icon-button voice-control" type="button" title="Unmute microphone" aria-label="Unmute microphone" aria-pressed="true"><span data-icon="mic-off"></span></button><button id="voice-deafen" class="icon-button voice-control" type="button" title="Deafen" aria-label="Deafen" aria-pressed="false"><span data-icon="headphones"></span></button><button class="icon-button" data-settings title="Settings" aria-label="Settings"><span data-icon="settings"></span></button></footer>
    </aside>
    <div id="room-workspace">
    <main id="stage-wrap">
      <header id="stage-head">
        <span class="room-heading-icon" data-icon="monitor"></span><div class="room-heading"><h1 id="room-title">Rooms</h1></div>
        <div class="header-actions">
          <button id="pop-out" class="icon-button" type="button" title="Pop out" aria-label="Pop out" hidden><span data-icon="popout"></span></button>
          <button id="fullscreen" class="icon-button" type="button" title="Fullscreen" aria-label="Fullscreen" hidden><span data-icon="expand"></span></button>
          <button id="chat-toggle" class="icon-button chat-toggle" type="button" title="Show chat" aria-label="Show chat" aria-controls="chat-panel" aria-expanded="false" hidden><span data-icon="chat"></span><span class="chat-badge" hidden></span></button>
        </div>
      </header>
      <div id="stage" class="is-idle">
        <video id="stage-video" autoplay playsinline muted></video><div id="stream-grid" aria-label="Live screen shares" hidden></div><div id="participant-grid" aria-label="Participants" hidden></div>
        <div id="waiting" role="status" aria-label="Select a room"><span data-icon="monitor"></span><p id="waiting-message" hidden></p></div>
        <button id="focused-stream-hide" class="focused-stream-hide" type="button" title="Hide selected stream" aria-label="Hide selected stream" hidden><span data-icon="eye-off"></span></button><div id="focused-stream-volume" class="focused-stream-volume" hidden><input id="focused-stream-volume-input" type="range" min="0" max="100" value="100" title="Selected stream volume" aria-label="Selected stream volume" /><output id="focused-stream-volume-value" for="focused-stream-volume-input">100%</output><button id="focused-stream-mute" class="focused-stream-mute" type="button" title="Mute selected stream" aria-label="Mute selected stream"><span data-icon="volume"></span></button></div>
        <p id="stage-note" class="note" role="alert" hidden></p><aside id="stream-metrics" aria-label="Stream statistics" hidden><section id="host-metrics" class="metric-card" hidden><header><strong>Host</strong><span>Sending</span></header><dl></dl></section><section id="viewer-metrics" class="metric-card" hidden><header><strong>Viewer</strong><span>Receiving</span></header><dl></dl></section></aside>
      </div>
      <button id="exit-focus" class="icon-button" title="Exit focus (Esc)" aria-label="Exit focus" hidden><span data-icon="focus"></span></button>
      <div id="focus-view-controls" aria-label="Stream controls"><button id="fullscreen-focus" class="icon-button" type="button" title="Fullscreen" aria-label="Fullscreen" hidden><span data-icon="expand"></span></button><button id="chat-focus-toggle" class="icon-button chat-toggle" type="button" title="Show chat" aria-label="Show chat" aria-controls="chat-panel" hidden><span data-icon="chat"></span><span class="chat-badge" hidden></span></button></div>
      <footer id="call-controls" hidden>
        <div class="call-actions">
          <button id="voice-focus-mute" class="control-button voice-control voice-focus-control" type="button" title="Unmute microphone" aria-label="Unmute microphone" aria-pressed="true"><span data-icon="mic-off"></span></button>
          <button id="voice-focus-deafen" class="control-button voice-control voice-focus-control" type="button" title="Deafen" aria-label="Deafen" aria-pressed="false"><span data-icon="headphones"></span></button>
          <button id="hear-audio" class="control-button" type="button" title="Enable audio" aria-label="Enable audio" hidden><span data-icon="volume"></span></button>
          <button id="hide-my-screen" class="control-button" type="button" title="Hide my screen" aria-label="Hide my screen" hidden><span data-icon="eye"></span></button>
          <button id="share" class="primary icon-action" type="button" title="Share screen" aria-label="Share screen" hidden><span data-icon="share"></span></button>
          <button id="stop-live" class="danger icon-action" type="button" title="Stop sharing" aria-label="Stop sharing" hidden><span data-icon="stop"></span></button>
          <button id="leave" class="leave-button" type="button" title="Leave room" aria-label="Leave room" hidden><span data-icon="leave"></span></button>
        </div>
      </footer>
    </main>
    <aside id="chat-panel" aria-label="Room chat" hidden>
      <header class="chat-header"><div id="chat-tabs" role="tablist" aria-label="Conversations"></div><button id="chat-hide" class="icon-button" type="button" title="Hide chat" aria-label="Hide chat"><span data-icon="close"></span></button></header>
      <div class="chat-history"><div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Messages" tabindex="0"></div><button id="chat-jump" class="control-button" type="button" title="Jump to new messages" aria-label="Jump to new messages" hidden><span data-icon="down"></span><span class="chat-badge" hidden></span></button></div>
      <form id="chat-form"><p id="chat-error" class="note" role="alert" hidden></p><div id="chat-attachment" aria-label="Images to send" hidden></div><input id="chat-file" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/avif" aria-label="Choose up to 10 images" hidden /><div class="chat-composer"><button id="chat-attach" class="icon-button" type="button" title="Attach image" aria-label="Attach image"><span data-icon="attach"></span></button><textarea id="chat-input" rows="1" maxlength="2000" aria-label="Message" placeholder="Message" title="Enter to send · Shift+Enter for a new line"></textarea><button id="chat-send" class="icon-button" type="submit" title="Send message" aria-label="Send message"><span data-icon="send"></span></button></div></form>
    </aside>
    </div>
  </div>
  <div id="chat-bubbles" aria-label="Chat previews"></div>
  <dialog id="chat-image-dialog" aria-label="Shared image" tabindex="-1"><button id="chat-image-previous" class="icon-button chat-image-nav" type="button" title="Previous image" aria-label="Previous image" hidden><span data-icon="previous"></span></button><img id="chat-image-full" alt="Shared image" /><button id="chat-image-next" class="icon-button chat-image-nav" type="button" title="Next image" aria-label="Next image" hidden><span data-icon="next"></span></button><div id="chat-image-sequence" role="group" aria-label="Images in this message" hidden></div><span id="chat-image-position" class="sr-only" role="status" aria-live="polite"></span></dialog>
  <dialog id="create-dialog" class="dialog small-dialog" aria-labelledby="create-title">
    <form id="create-form" class="dialog-content">
      <div class="panel-head"><h2 id="create-title">New room</h2><button class="icon-button" type="button" data-close="create-dialog" title="Close" aria-label="Close"><span data-icon="close"></span></button></div>
      <div class="create-input-row"><input id="new-room" type="text" aria-label="Room name" maxlength="64" placeholder="Room name" pattern="[A-Za-z0-9_\-]+" title="Letters, numbers, dashes, underscores" spellcheck="false" autocomplete="off" required /><button id="create-room" class="primary icon-action" type="submit" title="Create room" aria-label="Create room"><span data-icon="arrow"></span></button></div>
      <p id="create-note" class="note" role="alert" hidden></p>
    </form>
  </dialog>
  <dialog id="settings-dialog" class="dialog settings-dialog" aria-label="Settings">
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="Settings categories">
        <div role="tablist" aria-label="Settings" aria-orientation="vertical">
          <button id="settings-tab-account" role="tab" aria-selected="true" aria-controls="settings-panel-account" tabindex="0" data-settings-tab="account"><span data-icon="account"></span>Account</button>
          <button id="settings-tab-audio" role="tab" aria-selected="false" aria-controls="settings-panel-audio" tabindex="-1" data-settings-tab="audio"><span data-icon="headphones"></span>Audio</button>
          <button id="settings-tab-interface" role="tab" aria-selected="false" aria-controls="settings-panel-interface" tabindex="-1" data-settings-tab="interface"><span data-icon="monitor"></span>Interface</button>
          <button id="settings-tab-system" role="tab" aria-selected="false" aria-controls="settings-panel-system" tabindex="-1" data-settings-tab="system"><span data-icon="keyboard"></span>System</button>
        </div>
      </nav>
      <div class="settings-main">
        <header class="settings-header"><h2 id="settings-section-title">Account</h2><button class="icon-button" data-close="settings-dialog" title="Close" aria-label="Close settings"><span data-icon="close"></span></button></header>
        <div class="settings-panels">
          <section id="settings-panel-account" role="tabpanel" aria-labelledby="settings-tab-account" tabindex="0">
            <label class="field" for="display-name">Name<input id="display-name" type="text" maxlength="40" autocomplete="nickname" title="Updates your name in the current room" /></label>
          </section>
          <section id="settings-panel-audio" role="tabpanel" aria-labelledby="settings-tab-audio" tabindex="0" hidden>
            <div class="settings-section" id="audio-controls">
              <div class="audio-output-row"><label class="field" for="audio-output">Output<select id="audio-output"><option value="default">System default</option></select></label><button id="refresh-audio-output" class="control-button" type="button" title="Refresh devices" aria-label="Refresh audio devices"><span data-icon="refresh"></span></button></div>
              <label class="field audio-volume" for="audio-volume"><span class="volume-heading"><span>Output volume</span><output id="audio-volume-value" for="audio-volume">100%</output></span><input id="audio-volume" type="range" min="0" max="200" value="100" title="Global incoming audio volume" aria-label="Global incoming audio volume" /></label>
              <p id="audio-output-note" class="quality-note" role="status" hidden></p>
            </div>
            <div class="settings-section voice-settings">
              <div class="audio-output-row"><label class="field" for="voice-input">Input<select id="voice-input"><option value="default">System default</option></select></label><button id="voice-loopback" class="control-button" type="button" title="Start microphone test" aria-label="Start microphone test" aria-pressed="false"><span data-icon="headphones"></span></button><button id="refresh-voice-input" class="control-button" type="button" title="Refresh microphones" aria-label="Refresh microphones"><span data-icon="refresh"></span></button></div>
              <label class="field audio-volume" for="voice-input-volume"><span class="volume-heading"><span>Input volume</span><output id="voice-input-volume-value" for="voice-input-volume">100%</output></span><input id="voice-input-volume" type="range" min="0" max="100" value="100" title="Microphone input volume" aria-label="Microphone input volume" /></label>
              <p id="voice-input-note" class="quality-note" role="status" hidden></p>
            </div>
            <label class="check" for="voice-enabled"><span>Voice chat</span><input id="voice-enabled" type="checkbox" role="switch" checked title="Send and receive voice in the current room" /></label>
            <label class="check" for="voice-noise-suppression"><span>Noise supression</span><input id="voice-noise-suppression" type="checkbox" checked title="Reduce microphone background noise" /></label>
            <label class="field audio-volume" id="suppression-strength-field" for="voice-suppression-strength"><span class="volume-heading"><span>Suppression strength</span><output id="voice-suppression-strength-value" for="voice-suppression-strength">80%</output></span><input id="voice-suppression-strength" type="range" min="0" max="100" value="80" title="Lower values preserve more voice and background sound; 100% applies full suppression" aria-label="Suppression strength" /></label>
            <label class="check" for="voice-noise-gate"><span>Noise gate</span><input id="voice-noise-gate" type="checkbox" role="switch" checked title="Silence microphone audio below the input sensitivity threshold" /></label>
            <label class="check" for="voice-auto-sensitivity"><span>Automatically adjust input sensitivity</span><input id="voice-auto-sensitivity" type="checkbox" role="switch" checked /></label>
            <label class="field audio-volume input-sensitivity" for="voice-input-sensitivity"><span class="volume-heading"><span>Input sensitivity</span><output id="voice-input-sensitivity-value" for="voice-input-sensitivity">Automatic</output></span><span class="sensitivity-track"><span id="voice-input-level" aria-hidden="true"></span><input id="voice-input-sensitivity" type="range" min="-100" max="0" step="1" value="-50" aria-label="Input sensitivity" aria-describedby="voice-sensitivity-help" /></span></label>
            <output id="voice-gate-status" class="quality-note">Test your microphone to see the input level</output>
            <p id="voice-sensitivity-help" class="quality-note">Sounds below the threshold are silenced. Turn off automatic sensitivity to adjust it; move right to block louder background sounds.</p>
            <label class="check" for="voice-echo-cancellation"><span>Echo cancellation</span><input id="voice-echo-cancellation" type="checkbox" role="switch" checked title="Reduce speaker audio picked up by your microphone" /></label>
            <label class="check" for="voice-auto-gain-control"><span>Automatic gain control</span><input id="voice-auto-gain-control" type="checkbox" role="switch" title="Automatically adjust capture volume for a consistent voice level" /></label>
          </section>
          <section id="settings-panel-interface" role="tabpanel" aria-labelledby="settings-tab-interface" tabindex="0" hidden>
            <label class="check" for="show-stream-statistics"><span>Stream statistics</span><input id="show-stream-statistics" type="checkbox" role="switch" title="Show host and viewer stream statistics" /></label>
            <label class="check" for="show-chat-bubbles"><span>Show chat bubbles</span><input id="show-chat-bubbles" type="checkbox" role="switch" title="Preview messages while chat is hidden" /></label>
          </section>
          <section id="settings-panel-system" role="tabpanel" aria-labelledby="settings-tab-system" tabindex="0" hidden>
            <label class="field" for="update-channel">Update channel<select id="update-channel"><option value="stable">Stable</option><option value="beta">Beta</option></select></label>
            <label class="check" for="check-for-updates-on-startup"><span>Check for updates on startup</span><input id="check-for-updates-on-startup" type="checkbox" role="switch" title="Check GitHub Releases for a newer zodiak version when the app opens" /></label>
            <button id="check-for-updates" class="update-check-button" type="button" title="Check for updates now">Check for updates now</button>
          </section>
        </div>
        <footer class="settings-footer"><p id="settings-note" class="note" role="alert" hidden></p><button id="save-settings" class="primary icon-action" title="Save" aria-label="Save settings"><span data-icon="check"></span></button></footer>
      </div>
    </div>
  </dialog>
  <dialog id="server-dialog" class="dialog server-dialog" aria-label="Server connection">
    <div class="dialog-content">
      <div class="dialog-header-actions"><button class="icon-button" data-close="server-dialog" title="Close" aria-label="Close server connection"><span data-icon="close"></span></button></div>
      <label class="field" for="server-url">URL<input id="server-url" type="text" placeholder="127.0.0.1" title="LiveKit server address, for example 127.0.0.1" spellcheck="false" autocomplete="off" /></label>
      <label class="field" for="api-key">API key<input id="api-key" type="text" title="LiveKit API key" spellcheck="false" autocomplete="off" /></label>
      <label class="field" for="api-secret">API secret<input id="api-secret" type="password" title="LiveKit API secret" spellcheck="false" autocomplete="off" /></label>
      <p id="server-note" class="note" role="alert" hidden></p><div class="actions"><button id="save-server-settings" class="primary icon-action" title="Save server connection" aria-label="Save server connection"><span data-icon="check"></span></button></div>
    </div>
  </dialog>
  <dialog id="delete-dialog" class="dialog small-dialog" aria-labelledby="delete-title">
    <div class="dialog-content delete-dialog-content">
      <div class="panel-head"><h2 id="delete-title">Delete room</h2><button class="icon-button" data-close="delete-dialog" title="Close" aria-label="Close delete confirmation"><span data-icon="close"></span></button></div>
      <p id="delete-message" class="dialog-description"></p>
      <p id="delete-note" class="note" role="alert" hidden></p><div class="actions"><button class="ghost" type="button" data-close="delete-dialog">Cancel</button><button id="confirm-delete-room" class="danger" type="button">Delete</button></div>
    </div>
  </dialog>
  <dialog id="picker" class="dialog picker-card" aria-label="Share screen">
    <form id="picker-form" class="dialog-content">
      <div class="dialog-header-actions"><button id="refresh-sources" class="icon-button" type="button" title="Refresh sources" aria-label="Refresh sources"><span data-icon="refresh"></span></button><button id="cancel-share" class="icon-button" type="button" title="Close" aria-label="Cancel sharing"><span data-icon="close"></span></button></div>
      <div id="sources"></div>
      <div class="picker-foot">
        <div class="quality-grid"><label class="field" for="share-resolution">Resolution<select id="share-resolution"><option value="480p">480p</option><option value="720p">720p</option><option value="1080p" selected>1080p</option><option value="1440p">1440p</option></select></label><label class="field" for="share-framerate">FPS<select id="share-framerate"><option value="5">5</option><option value="15">15</option><option value="24">24</option><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option></select></label><label class="field" for="share-priority">Prioritize<select id="share-priority" title="Keeps the selected frame rate by reducing resolution when constrained"><option value="quality">Quality</option><option value="framerate" selected>Framerate</option></select></label><div class="bitrate-controls"><label class="field" for="share-bitrate-mode">Bitrate<select id="share-bitrate-mode"><option value="dynamic" selected>Dynamic</option><option value="fixed">Fixed</option></select></label><label id="fixed-bitrate-field" class="field fixed-bitrate-field" for="share-bitrate" hidden><span>Target <output id="share-bitrate-value" for="share-bitrate"></output></span><input id="share-bitrate" type="range" step="100000" /></label></div></div>
        <label class="check" for="system-audio"><span>System audio</span><input id="system-audio" type="checkbox" role="switch" checked /></label>
        <label class="check" for="block-discord-audio"><span>Exclude Discord</span><input id="block-discord-audio" type="checkbox" role="switch" checked /></label>
        <p id="picker-note" class="note" role="alert" hidden></p><div class="actions"><button id="go-live" class="primary icon-action" type="submit" title="Start sharing" aria-label="Start sharing" disabled><span data-icon="share"></span></button></div>
      </div>
    </form>
  </dialog>
  <dialog id="update-dialog" class="dialog update-dialog" aria-labelledby="update-title" aria-describedby="update-version" tabindex="-1">
    <div class="update-layout">
      <div class="update-brand"><img src="/logo.svg" alt="zodiak" /></div>
      <div class="update-content">
        <button id="update-close" class="icon-button" type="button" title="Later" aria-label="Dismiss update"><span data-icon="close"></span></button>
        <div class="update-heading"><h2 id="update-title" aria-live="polite">Update available</h2><p id="update-version"></p></div>
        <div id="update-download" hidden>
          <progress id="update-progress" max="100" aria-label="Update download"></progress>
          <div class="update-metrics"><span id="update-percent"></span><span id="update-size"></span></div>
        </div>
        <p id="update-error" role="alert" hidden></p>
        <div id="update-actions" class="update-actions">
          <button id="update-later" class="ghost" type="button"><span data-icon="later"></span>Later</button>
          <button id="update-primary" class="primary" type="button"></button>
        </div>
      </div>
    </div>
  </dialog>
  <div id="remote-audio-rack" hidden></div><script type="module" src="/src/main.ts"></script>
</body>
</html>
